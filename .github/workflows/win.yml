name: Windows.

on:
  workflow_dispatch:
  push:
    # Pushes to the canary or private-ci branches run their own workflows.
    branches-ignore:
      - public-canary
      - private-canary
      - 'private-ci/**'
      - 'private-ci-*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'

jobs:

  windows:
    name: Windows
    # FORK: depot-* runners belong to upstream's infra and are not available
    # here (the fork has zero registered runners); a PR/tag/nightly run would
    # queue forever. Always use the GitHub-hosted runner.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # FORK: x64 + Qt6 + Ninja Multi-Config only. The arm64 leg is broken in
        # the current upstream dependency stack (dav1d vs new MSVC on
        # windows-11-arm), x64_x86 and Qt5 legs are not needed for the fork.
        # Ninja Multi-Config instead of the default Visual Studio generator:
        # CMAKE_*_COMPILER_LAUNCHER is honored only by the Makefile and Ninja
        # generators, and ccache is what turns repeated CI runs into minutes.
        # A single generator leg keeps the cold-cache disk usage under the limit
        # of the standard windows runner.
        arch: [x64]
        qt: [qt6]
        generator: ["Ninja Multi-Config"]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      # FORK: the prepared Libraries tree depends on these arguments, so they
      # are part of the cache key; otherwise an exact hit restores a tree built
      # with different arguments and the rebuild never gets saved.
      PREPARE_ARGS: "silent ${{ matrix.qt }}"
      # FORK: cap the compiler cache so it stays inside the repository cache
      # budget together with the Libraries trees.
      CCACHE_MAXSIZE: "2G"
      CCACHE_SLOPPINESS: "pch_defines,time_macros"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Free up disk space.
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\MongoDB" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\MySQL" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\PostgreSQL" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\ghc" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\julia" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\SeleniumWebDrivers" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Miniconda" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\ProgramData\Miniconda" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\ghcup" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\cabal" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Microsoft SQL Server" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Microsoft SQL Server" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\LLVM" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\LLVM" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Microsoft Service Fabric" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Microsoft SDKs\Azure CLI2" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Amazon" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\ProgramData\kind" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Users\runneradmin\.dotnet" -ErrorAction SilentlyContinue
          Get-ChildItem "C:\hostedtoolcache\windows" -Directory | Where-Object { $_.Name -notlike "Python*" } | ForEach-Object { Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue }
          Get-PSDrive C

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "prepare-args: $PREPARE_ARGS" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

          # FORK: compiler cache for the application build (same version as
          # the Linux leg uses).
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-windows-x86_64.zip -o "$RUNNER_TEMP/ccache.zip"
          unzip -q "$RUNNER_TEMP/ccache.zip" -d "$RUNNER_TEMP/ccache-dist"
          echo "$RUNNER_TEMP/ccache-dist/ccache-4.13.6-windows-x86_64" >> $GITHUB_PATH
          echo "CCACHE_DIR=$RUNNER_TEMP/.ccache" >> $GITHUB_ENV

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat %PREPARE_ARGS%

      - name: Read configuration matrix.
        shell: bash
        run: |
          ARTIFACT_NAME="NoWidgetGram"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.generator }}"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define from matrix: $DEFINE"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.defines }}"
          fi
          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }}"
          if [ $GITHUB_REF == 'refs/heads/nightly' ]; then
            echo "Use the open credentials."
            API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        # FORK: */out/src/* is kept — it holds generated sources required by
        # the build (tdesktop_rust/out/src/wallet_engine/wallet_engine.cpp).
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/out/src/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      # FORK: save the trimmed caches right here — the post steps of
      # actions/cache skip saving when a later step fails, which threw away
      # the ~1.5h dependency build of every failed run.
      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Save Libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save Qt cache.
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-qt.outputs.cache-primary-key }}

      - name: Enlarge the pagefile (MSVC PCH commit headroom).
        # FORK: the tdesktop PCH is huge; every cl.exe that loads it commits
        # ~2-3 GB of private memory. The Release build OOMs on the 16 GB
        # windows runner with its tiny default pagefile —
        # "C3859 Failed to create virtual memory for PCH" +
        # "C1076 internal heap limit reached" (run 43647010406).
        # Raising the pagefile maximum lifts the commit limit live.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            "Commit limit before: {0:N1}GB" -f ((Get-WmiObject Win32_OperatingSystem).TotalVirtualMemorySize/1MB)
            $sys = Get-WmiObject -Class Win32_ComputerSystem -EnableAllPrivileges
            if ($sys.AutomaticManagedPagefile) {
              $sys.AutomaticManagedPagefile = $false
              $sys.Put() | Out-Null
            }
            $pf = Get-WmiObject -Class Win32_PageFileSetting | Where-Object { $_.Name -ieq 'C:\pagefile.sys' }
            if ($pf) {
              $pf.InitialSize = 8192
              $pf.MaximumSize = 24576
              $pf.Put() | Out-Null
            } else {
              Set-WmiInstance -Class Win32_PageFileSetting -Arguments @{ Name = 'C:\pagefile.sys'; InitialSize = 8192; MaximumSize = 24576 } | Out-Null
            }
            Get-WmiObject Win32_PageFileSetting | Format-List Name, InitialSize, MaximumSize
            "Commit limit after: {0:N1}GB (grows on demand up to RAM + pagefile max)" -f ((Get-WmiObject Win32_OperatingSystem).TotalVirtualMemorySize/1MB)
          } catch {
            Write-Host "::warning::Pagefile enlargement failed ($($_.Exception.Message)); continuing on the default pagefile. If MSVC OOMs on the PCH (C3859/C1076), lower the build --parallel."
          }

      - name: Restore ccache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-ccache-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-ccache-

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          ccache -z

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D CMAKE_EXE_LINKER_FLAGS="/PDB:NONE /INCREMENTAL:NO" ^
          -D CMAKE_SHARED_LINKER_FLAGS="/PDB:NONE /INCREMENTAL:NO" ^
          -D CMAKE_C_COMPILER_LAUNCHER=ccache ^
          -D CMAKE_CXX_COMPILER_LAUNCHER=ccache ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
          %TDESKTOP_BUILD_DEFINE%

          rem FORK: full parallelism again — the pagefile step above lifts the
          rem commit limit that the Release PCH used to exhaust (C3859/C1076).
          cmake --build ..\out --config Release --parallel 4

          ccache --show-stats

      - name: Save ccache.
        # FORK: save on any outcome (except cancellation) — a failed run still
        # leaves useful compiler cache behind.
        if: (success() || failure()) && env.ONLY_CACHE == 'false'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-ccache-${{ github.run_id }}

      - name: Move artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\NoWidgetGram.exe artifact/
          if exist %OUT%\Updater.exe move %OUT%\Updater.exe artifact/

      # FORK: SignPath code signing removed — see docs/fork-nowidgets.md.
      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          retention-days: 30
