name: MacOS.

on:
  workflow_dispatch:
  push:
    # Pushes to the canary or private-ci branches run their own workflows.
    branches-ignore:
      - public-canary
      - private-canary
      - 'private-ci/**'
      - 'private-ci-*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'

jobs:

  macos:
    name: MacOS
    # FORK: depot-* runners belong to upstream's infra and are not available
    # here; a PR/tag/nightly run would queue forever. Use the hosted runner.
    runs-on: macos-latest

    strategy:
      matrix:
        defines:
          - ""
    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      # FORK: the prepared Libraries tree depends on these arguments, so they
      # are part of the cache key; otherwise an exact hit restores a tree built
      # with different arguments and the rebuild never gets saved.
      PREPARE_ARGS: "silent"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config

          # Disable spotlight.
          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          # FORK: a unique primary key with a newest-first prefix restore.
          # A static exact key could never be re-saved after prepare had to
          # rebuild (a toolchain update on the runner image invalidates every
          # stage key inside prepare.py), so every run kept paying the full
          # dependency rebuild forever. prepare.py validates the restored
          # tree stage by stage anyway, so restoring the newest one is safe.
          key: ${{ runner.OS }}-libs-${{ env.PREPARE_ARGS }}-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-libs-${{ env.PREPARE_ARGS }}-

      - name: Libraries.
        run: |
          touch "$RUNNER_TEMP/prepare-stamp"
          ./$REPO_NAME/Telegram/build/prepare/mac.sh $PREPARE_ARGS
          # FORK: a rebuilt stage rewrites its cache_keys marker, a no-op run
          # touches nothing (restored mtimes predate the stamp). Save only a
          # rebuilt tree below.
          if find Libraries/cache_keys ThirdParty/cache_keys -newer "$RUNNER_TEMP/prepare-stamp" | grep -q .; then
            echo "PREPARE_REBUILT=true" >> $GITHUB_ENV
          else
            echo "PREPARE_REBUILT=false" >> $GITHUB_ENV
          fi

      - name: Free up some disk space.
        # FORK: */out/src/* and */local/src/* are kept — they hold generated
        # sources required by the build (wallet_engine.cpp; the macOS script
        # installs under Libraries/local, the Windows one under tdesktop_rust/out).
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/out/src/*' -o -path '*/local/src/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      # FORK: save the trimmed Libraries right here — the post step of
      # actions/cache skips saving when a later step fails, which threw away
      # the ~2h dependency build of every failed run.
      - name: Save Libraries cache.
        if: env.PREPARE_REBUILT == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=NoWidgetGram ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=NoWidgetGram" >> $GITHUB_ENV
          fi

          # FORK: the Swift translation module cannot be built as a fat binary
          # in a single pass, so each architecture is configured and built on
          # its own (the recipe of Telegram/build/build_mac.py) and the trees
          # are merged into one universal bundle with lipo.
          # FORK: no compiler cache on macOS — the per-architecture object
          # sets do not fit the 10 GB repository cache budget together with
          # the dependency trees, and a partially filled cache brings no hits
          # on these full rebuilds. The budget goes to the Windows and Linux
          # compiler caches, which save more per gigabyte.
          for ARCH in arm64 x86_64; do
            python3 Telegram/configure.py -GNinja -B "$PWD/out-$ARCH" \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -D DESKTOP_APP_MAC_ARCH=$ARCH \
            -D DESKTOP_APP_ENABLE_LTO=ON \
            -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} \
            -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
            $DEFINE
            cmake --build "$PWD/out-$ARCH" --target Telegram --parallel
          done

          ./tools/merge-mac-universal.sh out-arm64 out-x86_64 out/Release

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd $REPO_NAME/out/Release
          mkdir artifact
          mv NoWidgetGram.app artifact/
          mv Updater artifact/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPO_NAME }}/out/Release/artifact/
          retention-days: 30
